<style>
  /* Tremor en el celular: una pregunta por pantalla. Avisos (qué atender), Operaciones (cómo está cada una) y Mapa. */

  details.mas { border-bottom: 1px solid var(--linea); } details.mas summary { cursor: pointer; padding: 12px 16px; color: var(--tinta-2); font-weight: 600; }

  ol.cadena { list-style: none; margin: 4px 0 8px; padding: 0 16px; }

  ol.cadena li:not(:last-child)::after { content: ""; position: absolute; left: 9px; top: 28px; bottom: -14px; width: 2px; background: var(--linea); }
  ol.cadena li.ojo::before { background: #d08a2e; } ol.cadena li.mal::before { background: var(--rojo); }

  .via span { font-size: 15px; color: var(--tinta-2); } ol.cadena .modo { grid-column: 1; font-size: 14px; color: var(--tinta-2); }
  ol.cadena .aviso-t { grid-column: 1; font-size: 14px; color: var(--rojo); font-weight: 600; }

  .medidor { padding: 12px 16px 4px; } .m-num { display: flex; align-items: baseline; gap: 12px; }

  .nv { font-weight: 700; font-size: 15px; padding: 3px 8px; border-radius: 6px; } .nv-bajo { background: #eef1ef; color: var(--tinta-2); } .nv-medio { background: #f6e6d8; color: #8a4a1f; }
  .nv-alto { background: #f1cdb4; color: #7a2e10; } .nv-crítico { background: #8a3213; color: #fff; }
  .m-barra { position: relative; display: grid; grid-template-columns: 10fr 15fr 25fr 10fr; gap: 2px; height: 10px; margin: 16px 0 34px; }
  .m-barra i { border-radius: 3px; } .m-barra .b1 { background: #efe3d8; } .m-barra .b2 { background: #e3a67c; } .m-barra .b3 { background: #c8642f; } .m-barra .b4 { background: #8a3213; }
  .m-barra em { position: absolute; top: -5px; width: 4px; height: 20px; margin-left: -2px; background: var(--tinta); border-radius: 2px; box-shadow: 0 0 0 2px var(--papel); }
  .m-barra u { position: absolute; top: 12px; width: 0; height: 0; border: 5px solid transparent; border-bottom-color: var(--tinta-2); margin-left: -5px; text-decoration: none; }
  .m-barra u span { position: absolute; top: 9px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 12px; color: var(--tinta-2); }
  .m-pie { margin: 0; font-size: 13px; color: var(--tinta-2); }
  .waffle { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 16px 6px; } .waffle i { width: 18px; height: 18px; border-radius: 4px; }
  .w-op { background: #8a3213; } .w-fi { background: #c8642f; } .w-ex { background: #e3a67c; } .w-pr { background: #fff; box-shadow: inset 0 0 0 2px #c8642f; } .w-pa { background: #b9c3c2; }
  .w-ley { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0; padding: 0 16px 4px; list-style: none; font-size: 14px; color: var(--tinta-2); }
  .w-ley li { display: flex; align-items: center; gap: 5px; } .w-ley i { width: 10px; height: 10px; border-radius: 3px; } .w-ley b { color: var(--tinta); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 6px 16px; }
  .tiles div { background: #eaefed; border-radius: 10px; padding: 10px 12px; } .tiles b { display: block; font-size: 26px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .tiles span { font-size: 13px; line-height: 1.3; color: var(--tinta-2); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 16px; } .chips span { display: flex; align-items: center; gap: 5px; font-size: 14px; padding: 4px 10px; border-radius: 999px; background: #eef1ef; }
  .chips i, .casos i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .ch-sd i { background: #d7261e; } .ch-ac i { background: #c8642f; } .ch-ed i { background: #6f8f88; } .ch-la i { background: #b9c3c2; }
  .casos { margin: 0; padding: 2px 16px 4px; list-style: none; } .casos li { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--linea); font-size: 15px; }
  .casos span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; } .casos small { color: var(--tinta-2); font-size: 13px; }
.cifras-d { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 8px; margin: 4px 16px 8px; } .cifras-d div { display: grid; }
.cifras-d b { font-size: 28px; font-weight: 750; font-variant-numeric: tabular-nums; } .cifras-d span { font-size: 14px; color: var(--tinta-2); }
.leyenda-via i.punto.negro { background: #1c2629; } .leyenda-via i.via-l { background: #4a3b2e; height: 2px; margin-left: 4px; } .leyenda-via i.naranja { background: #e8962e; } .leyenda-via i.punto { width: 10px; height: 10px; border-radius: 50%; background: var(--rojo); margin-left: 4px; }
  .leyenda-via small { display: block; font-weight: 400; font-size: 13px; color: var(--tinta-2); max-width: 240px; }
  .cuando { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; padding: 18px 16px 0; }
  .cuando b { font-size: 34px; line-height: 1; font-weight: 750; font-variation-settings: var(--ancho); color: var(--rojo); }
  .cuando b::first-letter { text-transform: uppercase; } .cuando.paso b { color: var(--tinta-2); } .cuando span { color: var(--tinta-2); }
  .titulo-av { margin: 8px 16px 0; font-size: 22px; line-height: 1.25; text-wrap: balance; }
  dl.datos { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 14px 16px 4px; }
  dl.datos dt { font-size: 14px; font-weight: 700; color: var(--tinta-2); padding-top: 2px; } dl.datos dd { margin: 0; }
  ol.cadena li.nada::before { background: var(--linea); } ol.cadena li.nada b { color: var(--tinta-2); font-weight: 600; }
  .aclara { margin: 0 16px 4px; font-size: 14px; color: var(--tinta-2); }
  .resumen { margin: 4px 16px 0; line-height: 1.5; max-width: 60ch; }
  a.fuente { display: block; margin: 8px 16px; padding: 14px 16px; border-radius: 12px; background: #eaefed; color: var(--tinta); text-decoration: none;
    line-height: 1.4; transition: background-color 160ms ease, transform 140ms var(--sal); }
  a.fuente:hover { background: #e0e7e4; } a.fuente:active { transform: scale(0.98); }
  a.fuente small { display: block; margin-bottom: 4px; font-weight: 700; color: var(--cobre-4); }
  .etq { display: block; margin-top: 14px; font-size: 14px; font-weight: 700; color: var(--tinta-2); }
  .tono-neg { color: var(--rojo); } .tono-pos { color: var(--verde); }
  #mapa { position: fixed; inset: 0 0 calc(60px + env(safe-area-inset-bottom)); }
  @media (min-width: 900px) {
    body { padding-bottom: 60px; }

    nav { right: auto; border-right: 1px solid var(--linea); grid-template-columns: repeat(3, 1fr); }

    #mapa, #mapa[hidden] { display: block; inset: 0 0 0 440px; }

    button.vermapa.ir { display: none; }
  }
  nav { position: fixed; z-index: 6; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr);
    height: calc(60px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--papel); border-top: 1px solid var(--linea); }
  nav button { all: unset; cursor: pointer; display: grid; place-items: center; font-size: 15px; font-weight: 600; color: var(--tinta-2); position: relative; }
  nav button[aria-current="page"] { color: var(--tinta); }
  nav button[aria-current="page"]::before { content: ""; position: absolute; top: 0; width: 32px; height: 3px; border-radius: 0 0 3px 3px; background: var(--cobre); }

  nav .n { position: absolute; top: 9px; margin-left: 64px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--rojo); color: #fff;

<body>
<header id="cab"></header>
<main id="vista" aria-live="polite"><p class="vacio">Cargando…</p></main>
<div id="mapa" hidden></div>
<nav aria-label="Secciones">
  <button type="button" data-v="avisos">Avisos<span class="n" id="n-avisos" hidden></span></button>
  <button type="button" data-v="operaciones">Operaciones</button>
  <button type="button" data-v="pais">País</button>
  <button type="button" data-v="mapa">Mapa</button>
</nav>
<script>
const FUENTES = ["https://raw.githubusercontent.com/nicosil02/tremor/datos/web.json", "web.json"];
// nombre en pantalla: (cómo figura en el OEFA, alias en notas y radio) — los mismos de tremor/avisos.py
const EMPRESAS = {
  "Bateas": ["minera bateas", /bateas|caylloma|cailloma/i],
  "Raura": ["minera raura", /\braura\b/i],
  "Poderosa": ["minera poderosa", /minera poderosa|\bpataz\b/i],
  "Las Bambas": ["minera las bambas", /las bambas|\bmmg\b|ferrobamba|chalcobamba/i],
  "Southern": ["southern peru", /southern|toquepala|cuajone|t[ií]a mar[ií]a/i],
  "Antamina": ["minera antamina", /antamina/i],
  "Yanacocha": ["minera yanacocha", /yanacocha|\bconga\b/i],
};
const MES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "set", "oct", "nov", "dic"];
const TEMA = { protesta: "Protesta", judicial: "Proceso judicial", dialogo: "Diálogo", aporte: "Aporte social", ambiente: "Ambiente", otro: "En medios" };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const titulo = s => String(s ?? "").toLowerCase().replace(/(^|[\s(-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
const iso = d => new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const HOY = iso(new Date());
const dia = f => f ? `${+f.slice(8, 10)} ${MES[+f.slice(5, 7) - 1]}` : "";
const dias = f => Math.round((new Date(f + "T12:00") - new Date(HOY + "T12:00")) / 864e5);
const cuando = f => { const n = dias(f); return n === 0 ? "hoy" : n === 1 ? "mañana" : n > 1 ? `en ${n} días` : dia(f); };
const largo = f => { const s = new Date(f + "T12:00").toLocaleDateString("es-PE", { weekday: "long", day: "numeric", month: "long" }); return s[0].toUpperCase() + s.slice(1); };
const nivel = p => p >= 0.5 ? "Crítico" : p >= 0.25 ? "Alto" : p >= 0.1 ? "Medio" : "Bajo";
const flecha = d => d > 0.01 ? "↑" : d < -0.01 ? "↓" : "";
const pct = p => `${Math.round(p * 100)}%`;
const opera = o => /^operación/.test(o.etapa || "");
const accion = e => { const a = String(e.accion || "").toLowerCase();
  return /paro|huelga/.test(a) ? "Paro" : /bloque/.test(a) ? "Bloqueo" : /toma/.test(a) ? "Toma" : /march|moviliz/.test(a) ? "Marcha" : "Protesta"; };
const guardado = k => { try { return localStorage.getItem(k); } catch { return null; } };
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

// Piloto con una sola minera; en ?admin se ven todas para revisar que cada una salga bien
const PILOTO = ["Bateas", "Raura", "Poderosa", "Las Bambas"], ADMIN = /[?&]admin\b/.test(location.search);
const LISTA = ADMIN ? Object.keys(EMPRESAS) : PILOTO;
let D, A, E, empresa = LISTA.includes(guardado("tremor-empresa")) ? guardado("tremor-empresa") : PILOTO[0], pila = [];

const CADENA = fetch("cadena.json").then(r => r.json()).catch(() => ({}));
let CAD = {};
async function cargar() {
  for (const u of FUENTES) { try { const r = await fetch(u, { cache: "no-cache" }); if (r.ok) return r.json(); } catch {} }
  throw new Error("sin datos");
}
const zonaDe = u => [u, ...(D.vecinos[u] || [])];
const lugar = u => { if (!u || u === "00") return "Lugar sin precisar"; const a = A.get(u) || D.alerta.find(x => x.ubigeo.startsWith(u));
  if (!a) return u; const [dep, prov, dist] = a.lugar.split(" / ").map(titulo);
  return u.length >= 6 ? dist : u.length === 4 ? `Provincia de ${prov}` : dep; };

// Todo lo de una empresa: sus unidades, la zona de cada una, sus avisos y sus rutas
function armar() {
  const [oefa, alias] = EMPRESAS[empresa];
  const ops = D.operaciones.filter(o => o.empresa.toLowerCase().includes(oefa));
  const unidades = [...new Map(ops.map(o => [o.unidad, o])).values()].map(o => {
    const a = A.get(o.ubigeo) || {}, p = a.prob_zona_extractivo ?? null;
    return { ...o, p, normal: a.normal_zona_ext ?? null, a, zona: new Set(zonaDe(o.ubigeo)) };
  }).sort((x, y) => opera(y) - opera(x) || (y.p ?? -1) - (x.p ?? -1));
  const zona = new Set(unidades.flatMap(u => [...u.zona]));
  const SECTOR = /docente|maestr|profesor|m[eé]dic|enfermer|obstetr|salud|judicial|estatal|universit|estudiant|administrativ/i;
  const tramos = (CAD[empresa] || {}).tramos || [], sinBloqueo = e => SECTOR.test(e.actor || "") && !/bloque|toma/i.test(e.accion || ""),
    pasa = (r, u, e) => (r.ubigeos.includes(u)
    || (u.length < 6 && u !== "00" && /paro|bloque|huelga/i.test(e.accion || "") && r.ubigeos.some(x => x.startsWith(u)))),
    toca = (r, u, e) => !sinBloqueo(e) && pasa(r, u, e),  // sigue contando como conflictividad, pero no pinta la vía
    tramoDe = (u, e) => tramos.find(r => pasa(r, u, e));
  const rutas = [...new Set(unidades.filter(opera).flatMap(u => D.rutas[u.ubigeo] || []))];
  const avisos = [];
  for (const e of D.eventos) {
    const f = String(e.fecha_evento || e.fecha_anuncio || "").slice(0, 10), u = String(e.ubigeo);
    const trans = /transportista/i.test(e.actor || "") && !e.urbano, nombra = alias.test(`${e.empresa || ""} ${e.operacion || ""}`);
    if (!nombra && !(trans && u === "00") && !zona.has(u) && !tramoDe(u, e)) continue;
    const anun = e.estado === "anunciada" && !e.suspendido, viene = anun && f >= HOY;
    const cerca = unidades.find(x => x.zona.has(u));
    avisos.push({ f, urge: viene || (anun && dias(f) > -3), tipo: "Protesta", e, cerca, trans, tramo: tramoDe(u, e), tramos: tramos.filter(r => toca(r, u, e)),
      t: `${accion(e)}${e.actor ? ` de ${e.actor.toLowerCase()}` : ""}`,
      w: viene ? cuando(f) : dia(f),
      s: [u === "00" ? (trans ? "Puede frenar sus despachos" : "Lugar sin precisar") : !zona.has(u) && tramoDe(u, e) ? `${lugar(u)}, en su ruta${sinBloqueo(e) ? ", no suele cortar vías" : ""}` : lugar(u), e.suspendido ? "suspendida" : viene ? "" : anun ? "anunciada" : "ocurrió"].filter(Boolean).join(", ") });
  }
  for (const s of D.sutran || []) if (rutas.includes(s.via))
    avisos.push({ f: String(s.fecha_evento || HOY).slice(0, 10), urge: true, tipo: "Bloqueo", sutran: s, t: `Vía ${s.via} bloqueada`, w: "ahora",
      s: `${titulo(s.distrito || "")}, SUTRAN` });
  for (const m of D.menciones || []) if (alias.test(m.proyecto || "") && !avisos.some(x => x.e && x.e.titular === m.titular))
    avisos.push({ f: m.fecha, urge: false, tipo: TEMA[m.tema] || "En medios", m, t: m.titular.replace(/^[^:]{2,25}:\s*/, ""), w: dia(m.fecha),
      s: `${TEMA[m.tema] || "En medios"}, ${m.medio}` });
  avisos.sort((a, b) => b.urge - a.urge || (a.urge ? a.f.localeCompare(b.f) : b.f.localeCompare(a.f)));
  const casos = (D.casos || []).filter(c => zona.has(String(c.ubigeo)));
  // Estado de cada tramo: lo anunciado manda; si no, lo ocurrido en los últimos 14 días
  const cadena = tramos.map(r => { const ev = avisos.filter(x => x.e && toca(r, String(x.e.ubigeo), x.e));
    const bl = (D.sutran || []).filter(s => r.via && s.via === r.via).length;
    const prox = ev.filter(x => x.e.estado === "anunciada" && !x.e.suspendido && x.f >= HOY).sort((a, b) => a.f.localeCompare(b.f))[0];
    const rec = ev.filter(x => dias(x.f) >= -14 && x.f <= HOY).sort((a, b) => b.f.localeCompare(a.f))[0];
    const vago = (prox || rec) && String((prox || rec).e.ubigeo).length < 6 ? `, en ${lugar(String((prox || rec).e.ubigeo))} sin distrito` : "";
    // ponytail: fuera del número las capitales de departamento y Lima-Callao; su protesta urbana rara vez corta la carga,
    // y la EGPP pone ahí lo que no sabe ubicar. Siguen contando para los avisos. Mejor: protestas sobre la vía misma.
    const peor = r.ubigeos.filter(u => !/0101$/.test(u) && !/^(1501|0701)/.test(u)).map(u => [(A.get(u) || {}).prob ?? 0, u]).sort((a, b) => b[0] - a[0])[0] || [0, ""];
    return { ...r, vago, p: peor[0], peor: peor[1], estado: bl ? ["mal", "Bloqueo vigente"] : prox ? ["mal", `${accion(prox.e)} ${cuando(prox.f)}`] : rec ? ["ojo", `${accion(rec.e)} ${dia(rec.f)}`] : ["ok", "Sin avisos"] }; });
  // ponytail: tramos tratados como independientes; distritos vecinos se mueven juntos, así que es un techo
  const via = cadena.length ? 1 - cadena.reduce((q, r) => q * (1 - r.p), 1) : null;
  return { unidades, avisos, rutas, casos, cadena, via };
}
let X;

const fila = (cls, i, t, w, s, attrs = "") => `<li><button type="button" class="fila ${cls}" ${attrs}><i></i><span class="t">${esc(t)}</span><span class="w">${esc(w)}</span><span class="s">${esc(s)}</span></button></li>`;

function cabecera(atras, txt) {

    ? `<button type="button" class="atras" aria-label="Volver">‹</button><h1>${esc(txt)}</h1>`
    : `<select id="emp" class="titulo" aria-label="Empresa">${LISTA

  const at = document.querySelector("#cab .atras"); if (at) at.onclick = volver;
  const se = document.getElementById("emp"); if (se) se.onchange = () => { SEL = null; empresa = se.value; guardar("tremor-empresa", empresa); X = armar(); pila = []; ir(actual); };
}

// Imagen satelital del polígono de la unidad (Esri World Imagery, el mismo satélite del mapa de la versión completa)
const POLIS = fetch("operaciones.json").then(r => r.json()).catch(() => ({ features: [] }));
function foto(o) {
  POLIS.then(g => {
    const f = (g.features || []).find(f => f.properties.unidad === o.unidad && f.properties.empresa.toLowerCase().includes(EMPRESAS[empresa][0]));
    const el = document.getElementById("foto"); if (!f || !el) return;
    const cs = JSON.stringify(f.geometry.coordinates).match(/-?\d+\.\d+,-?\d+\.\d+/g).map(s => s.split(",").map(Number));
    let [w, s, e, n] = [Math.min(...cs.map(c => c[0])), Math.min(...cs.map(c => c[1])), Math.max(...cs.map(c => c[0])), Math.max(...cs.map(c => c[1]))];
    // proporción de la imagen (390 x 230) y un margen para ver lo que rodea al tajo
    const cx = (w + e) / 2, cy = (s + n) / 2, kx = Math.cos(cy * Math.PI / 180);
    let dx = (e - w) * 0.45 + 0.008, dy = (n - s) * 0.45 + 0.008;
    if (dx * kx / dy < 390 / 230) dx = dy * 390 / 230 / kx; else dy = dx * kx * 230 / 390;
    const url = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/export?bbox=${cx - dx},${cy - dy},${cx + dx},${cy + dy}&bboxSR=4326&imageSR=3857&size=780,460&format=jpg&f=image`;
    const img = new Image(); img.onload = () => { el.style.backgroundImage = `url("${url}")`; el.classList.add("lista"); }; img.src = url;
  });
}

  document.querySelectorAll("[data-op]").forEach(b => b.onclick = () => abrir(detalleOp(b.dataset.op)));
  document.querySelectorAll("[data-caso]").forEach(b => b.onclick = () => abrir(detalleCaso(+b.dataset.caso)));
  document.querySelectorAll("[data-distrito]").forEach(b => b.onclick = () => abrir(detalleDistrito(b.dataset.distrito)));
  document.querySelectorAll("[data-vermapa]").forEach(b => b.onclick = () => { PAIS_VISTA = actual === "pais"; ir("mapa"); });
}
document.querySelector("nav").onclick = e => { const b = e.target.closest("button"); if (b) { SEL = null; PAIS_VISTA = false; ir(b.dataset.v); } };

function verMapa() {
  if (!mapa) {
    mapa = new maplibregl.Map({ container: "mapa", style: "https://tiles.openfreemap.org/styles/positron", center: [-75, -10], zoom: 4.3, attributionControl: { compact: true } });
    mapa.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
    // nombres del mapa base en castellano ("Arequipa", no "Department of Arequipa")
    mapa.on("load", () => {
      mapa.getStyle().layers.forEach(l => l.type === "symbol" && l.layout && l.layout["text-field"]
        && mapa.setLayoutProperty(l.id, "text-field", ["coalesce", ["get", "name:es"], ["get", "name"]]));
      // relieve y satélite al acercarse, como en la versión completa (Esri World Imagery, Terrain Tiles de AWS)
      const bajo = mapa.getStyle().layers.find(c => c.type === "symbol")?.id;
      mapa.addSource("dem", { type: "raster-dem", encoding: "terrarium", tileSize: 256, maxzoom: 12, attribution: "Terrain Tiles (AWS, Mapzen)",
        tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"] });
      mapa.addLayer({ id: "sombra", type: "hillshade", source: "dem", paint: { "hillshade-exaggeration": 0.3,
        "hillshade-shadow-color": "#56676c", "hillshade-highlight-color": "#ffffff", "hillshade-accent-color": "#56676c" } }, bajo);
      mapa.addSource("sat", { type: "raster", tileSize: 256, maxzoom: 18, attribution: "Esri, Maxar",
        tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"] });
      mapa.addLayer({ id: "sat", type: "raster", source: "sat", minzoom: 6.5,
        paint: { "raster-opacity": ["interpolate", ["linear"], ["zoom"], 6.5, 0, 8, 1], "raster-fade-duration": 0 } }, bajo);
      for (const c of mapa.getStyle().layers) {  // mientras cargan las fotos, color de tierra en vez de blanco
        if (c.id === "sat") break;
        if (c.type === "background") mapa.setPaintProperty(c.id, "background-color", ["interpolate", ["linear"], ["zoom"], 7, mapa.getPaintProperty(c.id, "background-color") || "#f2f0eb", 8, "#7a6650"]);
        if (c.type === "fill") mapa.setPaintProperty(c.id, "fill-opacity", ["interpolate", ["linear"], ["zoom"], 7, 1, 8, 0]);
      }
    });
    mapa.on("click", "ops", ev => { const n = ev.features[0].properties.unidad; if (!ANCHO.matches) ir("operaciones"); abrir(detalleOp(n)); });
    mapa.on("click", "tramos", ev => {
      if (mapa.queryRenderedFeatures(ev.point, { layers: ["ops"] }).length) return;
      const { u, i } = ev.features[0].properties, r = X.cadena[i], p = (A.get(u) || {}).prob ?? 0;
      new maplibregl.Popup({ maxWidth: "260px" }).setLngLat(ev.lngLat).setHTML(`<b>${esc(lugar(u))}</b><br>Tramo ${esc(r.nombre)}${r.via ? `, ${esc(r.via)}` : ""}<br>
        Probabilidad de paro o bloqueo hasta diciembre, ${pct(p)}${u === r.peor ? `<br>Es el distrito más expuesto del tramo y da su ${pct(r.p)}` : ""}`).addTo(mapa); });
    ["ops", "tramos"].forEach(c => { mapa.on("mouseenter", c, () => mapa.getCanvas().style.cursor = "pointer"); mapa.on("mouseleave", c, () => mapa.getCanvas().style.cursor = ""); });
  } else mapa.resize();
  peru();
  if (ANCHO.matches) { const l = document.getElementById("ley") || document.body.appendChild(Object.assign(document.createElement("p"), { id: "ley", className: "leyenda-via" }));
    l.hidden = !X.cadena.length; if (X.cadena.length) l.innerHTML = ley(); }
  fetch("operaciones.json").then(r => r.json()).then(g => {
    const [oefa] = EMPRESAS[empresa];
    // un punto por unidad, en el centro de su polígono
    const centro = geo => { const r = geo.type === "Point" ? [geo.coordinates] : geo.type === "Polygon" ? geo.coordinates[0] : geo.coordinates[0][0];
      return [r.reduce((s, c) => s + c[0], 0) / r.length, r.reduce((s, c) => s + c[1], 0) / r.length]; };
    const fs = (g.features || []).filter(f => String(f.properties.empresa || "").toLowerCase().includes(oefa))
      .map(f => ({ type: "Feature", properties: { ...f.properties }, geometry: { type: "Point", coordinates: centro(f.geometry) } }));
    fs.forEach(f => { const o = X.unidades.find(u => u.unidad === f.properties.unidad); f.properties.p = o && o.p != null ? pct(o.p) : ""; f.properties.op = o && opera(o) ? 1 : 0; });
    const pintar = () => {
      const fc = { type: "FeatureCollection", features: fs };
      if (mapa.getSource("ops")) mapa.getSource("ops").setData(fc);
      else {
        mapa.addSource("ops", { type: "geojson", data: fc });
        mapa.addLayer({ id: "ops", type: "circle", source: "ops", paint: { "circle-radius": ["case", ["==", ["get", "op"], 1], 10, 6],
          "circle-color": "#b4542a", "circle-stroke-width": 2, "circle-stroke-color": ["case", ["==", ["get", "op"], 1], "#fff", "#3b2a20"] } });
        mapa.addLayer({ id: "ops-t", type: "symbol", source: "ops", layout: { "text-field": ["concat", ["get", "unidad"], "\n", ["get", "p"]], "text-size": 13,
          "text-offset": [0, 1.4], "text-anchor": "top", "text-font": ["Noto Sans Bold"] }, paint: { "text-halo-color": "#fff", "text-halo-width": 1.5 } });
      }
      const b = new maplibregl.LngLatBounds(); fs.forEach(f => b.extend(f.geometry.coordinates));
      if (!b.isEmpty() && !SEL && !X.cadena.length && !(actual === "pais" || PAIS_VISTA)) mapa.fitBounds(b, { padding: 60, maxZoom: 11, duration: 900 });
    };
    mapa.loaded() ? pintar() : mapa.once("load", pintar);
  }).catch(() => {});
  // la ruta: los distritos de cada tramo pintados por su riesgo y las carreteras que usa
  if (X.cadena.length) Promise.all([DISTRITOS(), RUTAS()]).then(([g, rg]) => {
    const de = new Map(X.cadena.flatMap((r, i) => r.ubigeos.map(u => [u, { i, p: r.p }])));
    const fc = { type: "FeatureCollection", features: g.features.filter(f => de.has(f.properties.u)).map(f => ({ ...f, properties: { ...f.properties, ...de.get(f.properties.u) } })) };
    // rótulo en el distrito que da el porcentaje de cada tramo
    const centro = f => { const cs = JSON.stringify(f.geometry.coordinates).match(/-?\d+\.?\d*,-?\d+\.?\d*/g).map(s => s.split(",").map(Number));
      return [cs.reduce((a, c) => a + c[0], 0) / cs.length, cs.reduce((a, c) => a + c[1], 0) / cs.length]; };
    const rotulos = { type: "FeatureCollection", features: X.cadena.map((r, i) => { const f = fc.features.find(f => f.properties.u === r.peor);
      return f && { type: "Feature", properties: { i, t: `${lugar(r.peor)}\n${pct(r.p)}` }, geometry: { type: "Point", coordinates: centro(f) } }; }).filter(Boolean) };
    const vias = new Set(X.cadena.map(r => r.via).filter(Boolean).concat(X.rutas));
    const lineas = { type: "FeatureCollection", features: rg.features.filter(f => vias.has(f.properties.r)) };
    const foco = FOCO; FOCO = null;
    const poner = () => {
      if (!mapa.getSource("tramos")) {
        mapa.addSource("tramos", { type: "geojson", data: fc }); mapa.addSource("vias", { type: "geojson", data: lineas });
        mapa.addLayer({ id: "tramos", type: "fill", source: "tramos", paint: { "fill-color": ["interpolate", ["linear"], ["get", "p"], 0, "#f3e1d3", 0.3, "#d98a5c", 0.6, "#8a3213"], "fill-opacity": 0.45 } }, "ops");
        mapa.addLayer({ id: "tramos-l", type: "line", source: "tramos", paint: { "line-color": "#8a3213", "line-width": 0.6 } }, "ops");
        mapa.addLayer({ id: "vias", type: "line", source: "vias", paint: { "line-color": "#e0a32e", "line-width": 3 } }, "ops");
        mapa.addSource("rotulos", { type: "geojson", data: rotulos });
        mapa.addLayer({ id: "rotulos", type: "symbol", source: "rotulos", layout: { "text-field": ["get", "t"], "text-font": ["Noto Sans Bold"], "text-size": 13 },
          paint: { "text-color": "#5c2410", "text-halo-color": "#fff", "text-halo-width": 1.8 } });
      } else { mapa.getSource("tramos").setData(fc); mapa.getSource("vias").setData(lineas); mapa.getSource("rotulos").setData(rotulos); }
      const b = new maplibregl.LngLatBounds();
      fc.features.filter(f => foco == null || f.properties.i === foco).forEach(f =>
        JSON.stringify(f.geometry.coordinates).match(/-?\d+\.?\d*,-?\d+\.?\d*/g).forEach(s => b.extend(s.split(",").map(Number))));
      if (!b.isEmpty() && !SEL && !(actual === "pais" || PAIS_VISTA)) mapa.fitBounds(b, { padding: 40, duration: 900 });
    };
    const listo = () => mapa.getLayer("ops") ? poner() : setTimeout(listo, 200);
    listo();
  });
  marcar();
}

Promise.all([cargar(), CADENA]).then(([d, c]) => {
  D = d; CAD = c; A = new Map(D.alerta.map(a => [a.ubigeo, a])); X = armar();
  const n = X.avisos.filter(x => x.urge).length, b = document.getElementById("n-avisos"); if (n) { b.textContent = n; b.hidden = false; }
  ir("avisos");
}).catch(() => { document.getElementById("vista").innerHTML = `<p class="vacio">No se pudieron cargar los datos. Revise su conexión y vuelva a abrir.</p>`; });
</script>
