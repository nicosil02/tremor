# T027 (001) y T026 (002): Defensoría + prensa cada 4 horas; guarda la base y los CSV en la rama `datos`.
# Si nada cambió, no hace commit. La EGPP se carga una sola vez desde la máquina del autor y viaja dentro de la base.
name: defensoria

on:
  schedule:
    - cron: "0 * * * *"     # cada hora: una protesta anunciada debe aparecer pronto (el LLM codifica lo que su cupo alcance)
  workflow_dispatch:
    inputs:
      reenviar:
        description: "Volver a mandar al cliente los avisos vigentes (prueba)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:            # dos corridas a la vez se pisarían la rama `datos`
  group: datos
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # La base de la corrida anterior vive en la rama `datos`, comprimida (sin comprimir pasa los 100 MB que
      # GitHub acepta por archivo). Sin ella no se sigue: la EGPP no se puede reconstruir aquí.
      - name: Traer la base anterior
        run: |
          mkdir -p datos
          git fetch --depth 1 origin datos
          git show origin/datos:tremor.db.gz | gunzip > datos/tremor.db
          mkdir -p datos/exportes && git archive origin/datos | tar -x -C datos/exportes --wildcards "*.csv"  # conserva los CSV de los otros workflows (la alerta del modelo)
          git show origin/datos:distritos.geojson > datos/distritos.geojson || true  # límites (tremor.distritos pnud)

      - name: Defensoría
        run: python -m tremor.defensoria todo

      - name: Operaciones y proyectos (una vez al día; OEFA, cartera del MINEM, SENACE y decretos de El Peruano)
        continue-on-error: true  # si la OEFA o el MINEM están caídos, sigue con las operaciones del día anterior
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          [ "$(date -u +%H)" = "11" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || exit 0
          python -m tremor.empresas cargar
          # cuánto detecta la prensa de lo que registra la Defensoría, por mes (tabla deteccion_mes); los dos últimos
          # meses con reporte, porque la Defensoría publica con un mes de rezago
          for m in $(python -c "import sqlite3;print(' '.join(f'{a}-{m:02d}' for a,m in sqlite3.connect('datos/tremor.db').execute('SELECT anio, mes FROM reporte ORDER BY num DESC LIMIT 2')))"); do
            python -m tremor.prensa validar --mes $m || true
          done
          python -m tremor.oefa   # fiscalización del OEFA: se baja una sola vez (el portal no publica desde abr 2025)

      - name: SUTRAN (alertas viales vigentes, y qué dicen los medios de cada bloqueo)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m tremor.sutran

      - name: Conflictos (con quién es cada uno; prensa para los que no tienen descripción)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m tremor.contexto

      - name: Prensa
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m tremor.prensa todo

      - name: Perfil por distrito (EGPP)
        run: python -m tremor.egpp perfil

      - name: Caché del clasificador (mDeBERTa NLI, ~1 GB)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clasifica-mdeberta-v1

      - name: De qué trata cada nota y su tono (transformer local, sin cuota)
        run: |
          pip install transformers sentencepiece
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m tremor.clasifica

      - name: Publicar en la rama datos
        env:  # sin estos secretos, los avisos solo se imprimen en el log
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m tremor.web   # web.json: lo que lee la página (docs/index.html)
          python -m tremor.avisos ${{ inputs.reenviar && '--reenviar' || '' }}   # Telegram a cada empresa: protestas en su zona, menciones en radio y subidas del riesgo
          mkdir -p /tmp/datos && gzip -9 -c datos/tremor.db > /tmp/datos/tremor.db.gz && cp datos/exportes/*.csv /tmp/datos/
          cp datos/exportes/web.json /tmp/datos/
          cp datos/distritos.geojson /tmp/datos/ || true
          git config user.name "tremor-bot"
          git config user.email "tremor-bot@users.noreply.github.com"
          git checkout --orphan datos-nueva
          git rm -rq --cached . && git clean -fdq -e datos
          cp /tmp/datos/* .
          git add tremor.db.gz *.csv *.geojson web.json
          if git fetch --depth 1 origin datos && git diff --quiet origin/datos -- *.csv; then
            echo "Sin datos nuevos: no se publica."
            exit 0
          fi
          git commit -qm "Datos al $(date -u +'%F %H:%M') UTC"
          git push -f origin datos-nueva:datos
