# Prueba de la radio en una máquina de GitHub, sin publicar nada: ¿cargan y corren Whisper (castellano), MMS (quechua
# y aimara) y NLLB (traducción) en ubuntu-latest, y cuánto tardan? radio.yml solo corre desde main; esta corre en la
# rama al tocar radio.py o este archivo. Borrarla cuando radio.yml corra en main.
name: radio-prueba

on:
  push:
    branches: [002-prensa-egpp]
    paths: [".github/workflows/radio-prueba.yml", "tremor/radio.py"]
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Caché de los modelos
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: radio-modelos-v2

      - run: |
          pip install -r requirements.txt faster-whisper transformers sentencepiece
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          sudo apt-get install -y -qq ffmpeg
          nproc; free -g

      - name: Cada modelo por separado
        run: |
          python - <<'EOF'
          import time, wave
          import numpy as np
          from faster_whisper import WhisperModel
          from tremor import radio
          r = {x["medio"]: x for x in radio.radios()}
          t = time.time(); m = WhisperModel("small", device="cpu", compute_type="int8"); print(f"Whisper cargado en {time.time() - t:.0f} s")
          assert radio.grabar(r["RPP Noticias"]["stream"], 120, "rpp.wav"), "RPP no grabó"
          t = time.time(); es, _ = radio.transcribir(m, "rpp.wav"); print(f"Whisper, 120 s de RPP en {time.time() - t:.0f} s: {es[:300]}")
          assert len(es) > 100, "Whisper no devolvió texto"
          ok = radio.grabar(r["Pachamama"]["stream"], 120, "puno.wav") or radio.grabar(r["Pachamama Radio"]["stream"], 120, "puno.wav")
          assert ok, "Pachamama no grabó"
          with wave.open("puno.wav") as w:
              a = np.frombuffer(w.readframes(w.getnframes()), np.int16).astype(np.float32) / 32768
          t = time.time(); q = radio.mms(a[:radio.SR * 60], "quz"); print(f"MMS quz, 60 s de Pachamama en {time.time() - t:.0f} s (incluye carga): {q[:300]}")
          t = time.time(); q = radio.mms(a[radio.SR * 60:radio.SR * 120], "quz"); print(f"MMS quz, otros 60 s en {time.time() - t:.0f} s")
          t = time.time(); y = radio.mms(a[:radio.SR * 30], "ayr"); print(f"MMS aimara, 30 s en {time.time() - t:.0f} s: {y[:200]}")
          frase = "Huancavelica llaqtapi mototaxi runakuna sayarirqanku municipalidadpa kamachiyninta mana munaspa"
          t = time.time(); tr = radio.traducir(frase, "quy"); print(f"NLLB en {time.time() - t:.0f} s: {tr}")
          assert tr.strip(), "NLLB no tradujo"
          EOF

      - name: De punta a punta, un grupo con radios del sur (5 min)
        run: |
          /usr/bin/time -v python -m tremor.radio escuchar --minutos 5 --grupo 2 --grupos 18 --indigena --salida prueba.jsonl 2>&1 | grep -v "^\s*\(Page\|Socket\|Signals\|Swaps\|File system\|Average\|Exit\|Voluntary\|Involuntary\|Minor\|Major\|Percent\|System time\|User time\)"
          python -c "import json; f=[json.loads(l) for l in open('prueba.jsonl', encoding='utf-8')]; print(len(f), 'fragmentos,', sum(x['filtro'] is None for x in f), 'al codificador,', sum('[original en' in x['resumen'] for x in f), 'traducidos')"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba-radio
          path: prueba.jsonl
          retention-days: 3
