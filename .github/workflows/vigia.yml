# Vigilante (tremor/vigia.py): una corrida se queda encendida 5 h 20 min dando una vuelta cada 2 minutos (SUTRAN, prensa,
# lectura de lo nuevo, avisos de Telegram) y antes de terminar lanza a su relevo. Es el único workflow que avisa al cliente.
# Su memoria es la rama `vivo`. El cron es solo la red de seguridad: si la cadena se corta, la retoma en menos de 3 h.
name: vigia

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      reenviar:
        description: "Volver a mandar al cliente los avisos vigentes (prueba)"
        type: boolean
        default: false

permissions:
  contents: write   # la rama `vivo`
  actions: write    # lanzar al relevo

jobs:
  # El cron solo hace falta si la cadena se cortó. Si hay un turno activo o un relevo en cola, sale sin hacer nada:
  # antes se quedaba en cola, el relevo lo cancelaba y cada cancelación era un correo de GitHub (39 de 70 corridas).
  guardia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      libre: ${{ steps.ver.outputs.libre }}
    steps:
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          otras=0
          if [ "${{ github.event_name }}" = "schedule" ]; then   # si la consulta falla, entra como antes
            otras=$(gh run list --repo ${{ github.repository }} --workflow vigia.yml --limit 20 --json databaseId,status \
              -q '[.[] | select(.status != "completed" and .databaseId != ${{ github.run_id }})] | length' || echo 0)
          fi
          echo "otras corridas del vigilante sin terminar: $otras"
          echo "libre=$([ "$otras" = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  vigilar:
    needs: guardia
    if: needs.guardia.outputs.libre == 'true'
    concurrency:        # uno solo a la vez: el relevo espera a que este termine
      group: vigia
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Vigilar
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TREMOR_CLIENTE: ${{ vars.TREMOR_CLIENTE || 'Las Bambas' }}   # quién recibe los avisos (prueba de la semana del 13 nov)
          GIT_AUTHOR_NAME: tremor-bot
          GIT_AUTHOR_EMAIL: tremor-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: tremor-bot
          GIT_COMMITTER_EMAIL: tremor-bot@users.noreply.github.com
        run: |
          mkdir -p datos
          python -m tremor.vigia --minutos 320 ${{ inputs.reenviar && '--reenviar' || '' }}

      - name: Relevo
        if: ${{ !cancelled() }}   # si se cancela a mano, no se relanza
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run vigia.yml --ref main
